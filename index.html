<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAPHyti</title>
  <link rel="icon" type="image/x-icon" href="resources/images/pudl.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <div class="header">

    <div class="logo">
      <a href="index.html">
        <img class="logo-img" src="resources\images\pudl.png" alt="Logo" width="32" height="32"> <!--This img is just a placeholder-->
        <span class="logo-text">GRAPHyti</span>
      </a>
    </div>

    <nav class="navigation">
      <a class="nav-button" href="index.html">Domov</a>
      <a class="nav-button" href="teorie.html">Teorie</a>
      <a class="nav-button" href="aboutus.html">O nás</a>
    </nav>

  </div>

  <div class="upload">
    <div class="upload-graphics-hide">
      <div class="upload-icon">
        <img src="resources\svgs\upload.svg" alt="Upload" width="92" height="92">
      </div>
      <div class="upload-title">
        <h1>Nahrajte soubor</h1>
        <p>Převeďte svůj <span id="fileTypeAnimWrapper"><span id="fileTypeAnim"> </span></span> soubor do grafu</p>
      </div>
    </div>
    <div class="upload-form">
      <div id="canvasDiv">
        <canvas id="myChart"></canvas>
      </div>
        <button class="button" id="uploadButton" type="button">Vyberte soubor</button>
        <form enctype="multipart/form-data" action="/upload/image" method="post">
          <input id="fileInput" type="file" accept=".json,.csv,.xml" style="display: none;"/>
        </form>
      </div>
  </div>

  <div class="graph-settings-wrapper">
    <div class="upload-title">
      <h1>Jaký chcete typ grafu?</h1>
      <p>Podporujeme typy grafů z nabídky níže.</p>
    </div>
    <div class="graph-settings">
      <div id="dropdown-select">
        <input id="graphTypeInput" type="text" placeholder="Search.." onkeyup="filterFunction()">
        <a onclick="selectGraphType('line')">Line</a>
        <a onclick="selectGraphType('bar')">Bar</a>
        <a onclick="selectGraphType('doughnut')">Doughnut</a>
        <a onclick="selectGraphType('polar')">Polar Area</a>
        <a onclick="selectGraphType('radar')">Radar</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script> 
</body>

</html>
