<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAPHyti</title>
  <link rel="icon" type="image/x-icon" href="resources/images/pudl.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <div class="header">

    <div class="logo">
      <a href="index.html">
        <img class="logo-img" src="resources\images\pudl.png" alt="Logo" width="32" height="32"> <!--This img is just a placeholder-->
        <span class="logo-text">GRAPHyti</span>
      </a>
    </div>

    <nav class="navigation">
      <a class="nav-button" href="index.html">Home</a>
      <a class="nav-button" href="aboutus.html">About Us</a>
      <a class="nav-button" href="theory.html">Teorie</a>
    </nav>

  </div>

  <div class="upload">
    <div class="upload-graphics-hide" style="visibility: visible;">
      <div class="upload-icon">
        <img src="resources\svgs\upload.svg" alt="Upload" width="92" height="92">
      </div>
      <div class="upload-title">
        <h1>Upload file</h1>
        <p>Turn your data file into a graph</p>
      </div>
    </div>
    <div class="upload-form">
      <div id="canvasDiv">
        <canvas id="myChart"></canvas>
      </div>
        <button class="button" id="uploadButton" type="button">Select file</button>
        <form enctype="multipart/form-data" action="/upload/image" method="post">
          <input id="fileInput" type="file" accept=".json,.csv,.xml" style="display: none;"/>
        </form>
      </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script> 
</body>

</html>
