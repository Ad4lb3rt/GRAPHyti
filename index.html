  <div class="graph-settings-wrapper">
    <div class="upload-title">
      <h1>Jaký chcete typ grafu?</h1>
      <p>Podporujeme typy grafů z nabídky níže.</p>
    </div>
    <div class="graph-settings">
      <div id="dropdown-select">
        <input id="graphTypeInput" type="text" placeholder="Search.." onkeyup="filterFunction()">
        <a>Line</a>
        <a>Bar</a>
        <a>Doughnut</a>
        <a>Polar Area</a>
        <a>Radar</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script> 
  <script>
    function filterFunction() {
      const input = document.getElementById("graphTypeInput");
      const filter = input.value.toUpperCase();
      const div = document.getElementById("dropdown-select");
      const a = div.getElementsByTagName("a");
      for (let i = 0; i < a.length; i++) {
        txtValue = a[i].textContent || a[i].innerText;
        if (txtValue.toUpperCase().indexOf(filter) > -1) {
          a[i].style.filter = "none";
          a[i].style.opacity = "1";
        } else {
          a[i].style.filter = "blur(4px)";
          a[i].style.opacity = "0.6";
        }
      }
    }
  </script>
